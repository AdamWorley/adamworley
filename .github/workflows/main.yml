# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  schedule: [{cron: "0 23 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: AdamWorley
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/London
          # Disabled: the achievements GraphQL query still requests `user.projects`
          # (Projects classic), which GitHub sunset, so the query returns no data and
          # the plugin renders "Unexpected error". Re-enable once fixed upstream.
          # https://github.blog/changelog/2024-05-23-sunset-notice-projects-classic/
          plugin_achievements: no
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          # Disabled: GitHub's events API no longer returns `commits` in PushEvent
          # payloads, and the plugin dereferences it unguarded, so it throws on any
          # recent push. plugin_activity_filter does not help — it is applied after
          # the parsing loop that crashes. Re-enable once fixed upstream.
          plugin_activity: no
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          # Disabled: Cloudflare Bot Fight Mode on blog.adamworley.com issues a managed
          # challenge to the GitHub Actions runner, so the fetch returns 403.
          plugin_rss: no
          plugin_rss_limit: 4
          plugin_rss_source: https://blog.adamworley.com/rss.xml
          plugin_stars: yes
          plugin_stars_limit: 4
